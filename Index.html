
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JB Trading Site</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    header {
      background: #17243a;
      padding: 22px;
    }
    h1 { color: #28d99a; }
    main { padding: 24px 16px; }
    .card {
      background: #1c2b42;
      padding: 20px;
      margin: 16px auto;
      border-radius: 14px;
      max-width: 420px;
    }
    button {
      background: #28d99a;
      color: #101827;
      border: 0;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: bold;
    }
    a { color: #28d99a; }
    .muted { color: #b8c4d6; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>JB TRADING SITE</h1>
    <p>Your trading dashboard</p>
  </header>
  <main>
    <div class="card">
      <h2>Welcome to JB Trading</h2>
      <p>Explore the markets and learn about trading.</p>
      <button onclick="alert('Trading dashboard coming soon!')">
        Open Dashboard
      </button>
    </div>
    <div class="card">
      <h2>Market Chart</h2>
      <p>Chart integration coming soon.</p>
    </div>
    <div class="card">
      <h2>Wallet</h2>
      <p>Deposit and withdrawal features are not yet connected.</p>
    </div>
    <p class="muted">
      Demo website only. No real deposits or live trades.
    </p>
  </main>
</body>
</html>
